include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    invalid_annotation_target: ignore
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

linter:
  rules:
    # Public constructors intentionally map readable named parameters to
    # private fields; initializing formals would expose private parameter names.
    prefer_initializing_formals: false
    prefer_final_locals: true
    use_super_parameters: true
