name: leeef_reader
description: A cross-platform, sync-first and MCP-native ebook reader.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  crypto: ^3.0.6
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  file_picker: ^12.0.0
  flutter:
    sdk: flutter
  flutter_inappwebview: ^6.2.0-beta.3
  flutter_riverpod: ^3.4.2
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5
  uuid: ^4.5.1

dev_dependencies:
  build_runner: ^2.16.0
  drift_dev: ^2.34.5
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/foliate-js/
    - assets/foliate-js/vendor/
    - assets/fixtures/m0.epub
    - assets/reader/
  shaders:
    - shaders/page_curl.frag
