name: leeef_reader
description: A cross-platform, sync-first and MCP-native ebook reader.
publish_to: none
version: 1.0.1+4

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  archive: ^4.2.0
  audioplayers: ^6.5.1
  audio_service: ^0.18.19
  audio_session: ^0.2.4
  aws_common: ^0.7.15
  aws_signature_v4: ^0.6.13
  charset: ^2.0.1
  connectivity_plus: ^7.3.1
  crypto: ^3.0.6
  desktop_drop: ^0.8.1
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  file_picker: ^12.0.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_local_notifications: ^22.3.0
  flutter_inappwebview: ^6.2.0-beta.3
  flutter_riverpod: ^3.4.2
  flutter_secure_storage: ^10.0.0
  flutter_tts: ^4.2.5
  path_provider: ^2.1.6
  pdfrx: ^2.4.7
  receive_sharing_intent: ^1.9.0
  share_plus: ^13.3.0
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2
  uuid: ^4.5.1
  window_manager: ^0.5.2
  xml: ^7.0.1
  wakelock_plus: ^1.7.0
  pinyin: ^3.3.0
  workmanager: ^0.10.9
  package_info_plus: ^10.2.1
dev_dependencies:
  build_runner: ^2.16.0
  drift_dev: ^2.34.5
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  integration_test:
    sdk: flutter
  sqlite3: ^3.5.2

flutter:
  uses-material-design: true
  assets:
    - assets/foliate-js/
    - assets/foliate-js/vendor/
    - assets/fixtures/m0.epub
    - assets/reader/
  shaders:
    - shaders/page_curl.frag
