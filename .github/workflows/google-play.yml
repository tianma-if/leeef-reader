name: Publish Google Play

on:
  workflow_dispatch:
    inputs:
      track:
        description: Google Play track
        required: true
        default: internal
        type: choice
        options: [internal, alpha, beta, production]
      release_status:
        description: Draft keeps the Play release from becoming available
        required: true
        default: draft
        type: choice
        options: [draft, completed]
      artifact_run_id:
        description: Reuse a signed AAB from a completed run of this workflow (optional)
        required: false
        type: string
      release_tag:
        description: Existing version tag required when reusing an AAB
        required: false
        type: string
      changes_not_sent_for_review:
        description: Only enable when Play explicitly requires retaining changes for manual review
        required: true
        default: false
        type: boolean
  release:
    types: [published]

permissions:
  contents: read
  actions: read

concurrency:
  group: leeef-google-play
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.repository == 'tianma-if/leeef-reader' &&
      (github.event_name == 'workflow_dispatch' || github.event.release.prerelease == false)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: google-play
    env:
      PLAY_TRACK: ${{ github.event_name == 'release' && 'production' || inputs.track }}
      PLAY_RELEASE_STATUS: ${{ github.event_name == 'release' && 'completed' || inputs.release_status }}
      REUSE_ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
      RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}
      CHANGES_NOT_SENT_FOR_REVIEW: ${{ github.event_name == 'workflow_dispatch' && inputs.changes_not_sent_for_review || false }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}
      - name: Validate published release and app version
        if: github.event_name == 'release'
        run: |
          if ! printf '%s' "$RELEASE_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Published Google Play releases require a stable vX.Y.Z tag"
            exit 1
          fi
          app_version="$(sed -nE 's/^version: ([0-9]+\.[0-9]+\.[0-9]+)\+[0-9]+$/\1/p' pubspec.yaml)"
          test "v$app_version" = "$RELEASE_TAG"
      - name: Test Play artifact reuse guard
        run: node --test test/google_play_retry.test.mjs
      - name: Validate reusable signed AAB source
        if: env.REUSE_ARTIFACT_RUN_ID != ''
        uses: actions/github-script@v7
        env:
          SOURCE_RUN_ID: ${{ env.REUSE_ARTIFACT_RUN_ID }}
        with:
          script: |
            const runId = process.env.SOURCE_RUN_ID;
            const tag = process.env.RELEASE_TAG;
            if (!/^[1-9][0-9]*$/.test(runId) || !/^v\d+\.\d+\.\d+$/.test(tag)) {
              throw new Error('A numeric artifact run ID and stable release tag are required.');
            }
            const { data: source } = await github.rest.actions.getWorkflowRun({
              ...context.repo, run_id: Number(runId),
            });
            const { data: commit } = await github.rest.repos.getCommit({
              ...context.repo, ref: tag,
            });
            if (source.head_repository.full_name !== `${context.repo.owner}/${context.repo.repo}` ||
                source.path !== '.github/workflows/google-play.yml' ||
                !['workflow_dispatch', 'release'].includes(source.event) || source.status !== 'completed' ||
                source.head_sha !== commit.sha) {
              throw new Error('Artifact source must be a completed official Play run for the exact release tag.');
            }
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              ...context.repo, run_id: Number(runId), filter: 'latest', per_page: 100,
            });
            const job = jobs.find(job => job.name === 'publish');
            for (const step of ['Build signed Android App Bundle', 'Verify Play build cannot self-install APKs', 'Upload build artifact']) {
              if (!job?.steps?.some(item => item.name === step && item.conclusion === 'success')) {
                throw new Error(`Reusable AAB gate did not pass: ${step}`);
              }
            }
            core.info(`Reusing signed AAB for ${tag}, source ${source.head_sha}, run ${runId}`);
      - name: Download verified signed AAB
        if: env.REUSE_ARTIFACT_RUN_ID != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ env.REUSE_ARTIFACT_RUN_ID }}
        run: |
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name leeef-reader-android-aab --dir build/app/outputs/bundle/release
          test -s build/app/outputs/bundle/release/app-release.aab
      - uses: subosito/flutter-action@v2
        if: env.REUSE_ARTIFACT_RUN_ID == ''
        with:
          flutter-version: 3.47.1
          channel: stable
          cache: true
      - name: Restore upload keystore
        if: env.REUSE_ARTIFACT_RUN_ID == ''
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/leeef-upload.jks"
          chmod 600 "$RUNNER_TEMP/leeef-upload.jks"
          {
            echo "storeFile=$RUNNER_TEMP/leeef-upload.jks"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > android/key.properties
      - run: flutter pub get
        if: env.REUSE_ARTIFACT_RUN_ID == ''
      - run: flutter analyze
        if: env.REUSE_ARTIFACT_RUN_ID == ''
      - run: flutter test
        if: env.REUSE_ARTIFACT_RUN_ID == ''
      - name: Build signed Android App Bundle
        if: env.REUSE_ARTIFACT_RUN_ID == ''
        run: flutter build appbundle --release
      - name: Verify Play build cannot self-install APKs
        if: env.REUSE_ARTIFACT_RUN_ID == ''
        run: |
          manifest="$(find build/app/intermediates/packaged_manifests/release -name AndroidManifest.xml -print -quit)"
          test -n "$manifest"
          if grep -q 'android.permission.REQUEST_INSTALL_PACKAGES' "$manifest"; then
            echo "Play build must not request REQUEST_INSTALL_PACKAGES"
            exit 1
          fi
      - name: Upload build artifact
        if: env.REUSE_ARTIFACT_RUN_ID == ''
        uses: actions/upload-artifact@v7
        with:
          name: leeef-reader-android-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
      - name: Publish to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: dev.leeef.leeef_reader
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          tracks: ${{ env.PLAY_TRACK }}
          status: ${{ env.PLAY_RELEASE_STATUS }}
          changesNotSentForReview: ${{ env.CHANGES_NOT_SENT_FOR_REVIEW }}
      - name: Remove signing material
        if: always()
        run: rm -f android/key.properties "$RUNNER_TEMP/leeef-upload.jks"
