name: Leeef CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ci.yml"
      - "apps/reader/**"
      - "sidecars/leeef-mcp/**"

concurrency:
  group: leeef-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reader:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/reader
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/reader/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  mcp:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: sidecars/leeef-mcp
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: sidecars/leeef-mcp/go.mod
          cache-dependency-path: sidecars/leeef-mcp/go.sum
      - run: go test ./...
