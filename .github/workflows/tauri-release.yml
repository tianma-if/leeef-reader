name: Tauri signed release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: GitHub Release tag to attach signed installers
        required: true
        type: string
        default: v2.2.0
      upload_play:
        description: Upload the signed AAB to Google Play production
        required: true
        type: boolean
        default: true
      upload_appstore:
        description: Upload the signed IPA to App Store Connect
        required: true
        type: boolean
        default: true
      submit_appstore:
        description: Submit the processed build for App Review and release automatically after approval
        required: true
        type: boolean
        default: true
      ios_build_number:
        description: Optional CFBundleVersion override (default major*1000000+minor*1000+patch)
        required: false
        type: string
      platforms:
        description: Which signed jobs to run
        required: true
        type: choice
        options: [all, macos, android, ios, appstore-submit]
        default: all

permissions:
  contents: write

concurrency:
  group: tauri-release-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  macos:
    if: github.repository == 'tianma-if/leeef-reader' && (inputs.platforms == 'all' || inputs.platforms == 'macos')
    name: Signed macOS DMG
    runs-on: macos-15
    timeout-minutes: 90
    environment: macos-distribution
    defaults:
      run:
        working-directory: apps/reader
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.release_tag }}
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/reader/src-tauri
      - run: bun ci
      - name: Import Developer ID certificates
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.MACOS_CERTIFICATES_FILE_BASE64 }}
          p12-password: ${{ secrets.MACOS_CERTIFICATES_PASSWORD }}
      - name: Write App Store Connect API key
        env:
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          APPSTORE_API_KEY_ID: ${{ vars.APPSTORE_API_KEY_ID }}
        run: |
          test -n "$APPSTORE_API_PRIVATE_KEY"
          test -n "$APPSTORE_API_KEY_ID"
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          key_path="$HOME/.appstoreconnect/private_keys/AuthKey_${APPSTORE_API_KEY_ID}.p8"
          printf '%s\n' "$APPSTORE_API_PRIVATE_KEY" > "$key_path"
          chmod 600 "$key_path"
          echo "APPLE_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"
      - name: Build signed and notarized app
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.MACOS_CERTIFICATE_NAME }}
          APPLE_API_KEY: ${{ vars.APPSTORE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ vars.APPSTORE_ISSUER_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          CI: true
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          bun run tauri build --target universal-apple-darwin --bundles dmg,app
      - name: Stage GitHub Release assets
        run: |
          version="$(node -p "require('./package.json').version")"
          mkdir -p "$RUNNER_TEMP/macos-dist"
          dmg="$(find src-tauri/target/universal-apple-darwin/release/bundle/dmg -name '*.dmg' | head -n 1)"
          app="$(find src-tauri/target/universal-apple-darwin/release/bundle/macos -name '*.app' | head -n 1)"
          updater="$(find src-tauri/target/universal-apple-darwin/release/bundle -name '*.app.tar.gz' | head -n 1)"
          test -n "$dmg"
          test -n "$app"
          test -n "$updater"
          test -s "$updater.sig"
          cp "$dmg" "$RUNNER_TEMP/macos-dist/Leeef-Reader-${version}-macos-universal.dmg"
          ditto -c -k --keepParent "$app" "$RUNNER_TEMP/macos-dist/Leeef-Reader-${version}-macos-universal.zip"
          cp "$updater" "$RUNNER_TEMP/macos-dist/Leeef-Reader-${version}-macos-universal.app.tar.gz"
          cp "$updater.sig" "$RUNNER_TEMP/macos-dist/Leeef-Reader-${version}-macos-universal.app.tar.gz.sig"
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"
          echo "UPDATER_ARCHIVE=$RUNNER_TEMP/macos-dist/Leeef-Reader-${version}-macos-universal.app.tar.gz" >> "$GITHUB_ENV"
          echo "UPDATER_SIGNATURE=$RUNNER_TEMP/macos-dist/Leeef-Reader-${version}-macos-universal.app.tar.gz.sig" >> "$GITHUB_ENV"
      - name: Generate and verify updater manifest
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          notes="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body)"
          NOTES="$notes" node <<'NODE'
          const fs = require('node:fs')
          const path = require('node:path')

          const filename = path.basename(process.env.UPDATER_ARCHIVE)
          const asset = {
            signature: fs.readFileSync(process.env.UPDATER_SIGNATURE, 'utf8').trim(),
            url: `https://github.com/${process.env.GITHUB_REPOSITORY}/releases/download/${process.env.RELEASE_TAG}/${filename}`,
          }
          const manifest = {
            version: process.env.APP_VERSION,
            notes: process.env.NOTES,
            pub_date: new Date().toISOString(),
            platforms: {
              'darwin-aarch64': asset,
              'darwin-x86_64': asset,
            },
          }
          fs.writeFileSync(
            path.join(process.env.RUNNER_TEMP, 'macos-dist', 'latest.json'),
            `${JSON.stringify(manifest, null, 2)}\n`,
          )
          NODE
          jq -e --arg version "$APP_VERSION" '
            .version == $version and
            (.platforms["darwin-aarch64"].url | endswith(".app.tar.gz")) and
            (.platforms["darwin-aarch64"].signature | length > 0) and
            .platforms["darwin-aarch64"] == .platforms["darwin-x86_64"]
          ' "$RUNNER_TEMP/macos-dist/latest.json" >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: leeef-macos
          path: ${{ runner.temp }}/macos-dist/*
      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          gh release upload "$RELEASE_TAG" \
            "$RUNNER_TEMP/macos-dist/"* \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

  android:
    if: github.repository == 'tianma-if/leeef-reader' && (inputs.platforms == 'all' || inputs.platforms == 'android')
    name: Signed Android APK and AAB
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: google-play
    defaults:
      run:
        working-directory: apps/reader
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.release_tag }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r28c
          link-to-sdk: true
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/reader/src-tauri
      - run: bun ci
      - name: Restore upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/leeef-upload.jks"
          chmod 600 "$RUNNER_TEMP/leeef-upload.jks"
          {
            echo "storeFile=$RUNNER_TEMP/leeef-upload.jks"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
          } > src-tauri/gen/android/keystore.properties
      - name: Build signed Android packages
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: bun run tauri android build --apk --aab --target aarch64
      - name: Stage GitHub Release assets
        run: |
          version="$(node -p "require('./package.json').version")"
          mkdir -p "$RUNNER_TEMP/android-dist"
          apk="$(find src-tauri/gen/android/app/build/outputs/apk -name '*release*.apk' | head -n 1)"
          aab="$(find src-tauri/gen/android/app/build/outputs/bundle -name '*release*.aab' | head -n 1)"
          test -n "$apk"
          test -n "$aab"
          cp "$apk" "$RUNNER_TEMP/android-dist/Leeef-Reader-${version}-android-arm64.apk"
          cp "$aab" "$RUNNER_TEMP/android-dist/Leeef-Reader-${version}-android.aab"
          echo "ANDROID_AAB=$RUNNER_TEMP/android-dist/Leeef-Reader-${version}-android.aab" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: leeef-android
          path: ${{ runner.temp }}/android-dist/*
      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          gh release upload "$RELEASE_TAG" \
            "$RUNNER_TEMP/android-dist/"* \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
      - name: Publish AAB to Google Play production
        if: inputs.upload_play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: dev.leeef.leeef_reader
          releaseFiles: ${{ env.ANDROID_AAB }}
          tracks: production
          status: completed
      - name: Remove signing material
        if: always()
        run: rm -f src-tauri/gen/android/keystore.properties "$RUNNER_TEMP/leeef-upload.jks"

  ios:
    if: github.repository == 'tianma-if/leeef-reader' && (inputs.platforms == 'all' || inputs.platforms == 'ios')
    name: Signed iOS IPA
    runs-on: macos-26
    timeout-minutes: 120
    environment: app-store
    defaults:
      run:
        working-directory: apps/reader
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.release_tag }}
      - name: Select stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          # App Store submissions reject beta toolchains. Pin the accepted
          # stable release instead of inheriting a moving runner default.
          xcode-version: "26.6"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
          components: llvm-tools
      - name: Put llvm-objcopy on PATH
        run: |
          host="$(rustc -vV | sed -n 's/^host: //p')"
          bin="$(rustc --print sysroot)/lib/rustlib/${host}/bin"
          test -x "$bin/llvm-objcopy"
          echo "$bin" >> "$GITHUB_PATH"
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/reader/src-tauri
      - run: bun ci
      - name: Import Apple Distribution certificate
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.APPSTORE_CERTIFICATES_FILE_BASE64 }}
          p12-password: ${{ secrets.APPSTORE_CERTIFICATES_PASSWORD }}
      - name: Download App Store provisioning profile
        uses: apple-actions/download-provisioning-profiles@v4
        with:
          bundle-id: dev.leeef.leeefReader
          profile-type: IOS_APP_STORE
          issuer-id: ${{ vars.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ vars.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
      - name: Resolve iOS provisioning profile
        run: |
          profile="$(ls -t "$HOME/Library/MobileDevice/Provisioning Profiles"/*.mobileprovision | head -n 1)"
          test -n "$profile"
          test -s "$profile"
          profile_uuid="$(security cms -D -i "$profile" | plutil -extract UUID raw -)"
          profile_name="$(security cms -D -i "$profile" | plutil -extract Name raw -)"
          test -n "$profile_uuid"
          test -n "$profile_name"
          echo "IOS_PROFILE_UUID=$profile_uuid" >> "$GITHUB_ENV"
          echo "IOS_PROFILE_NAME=$profile_name" >> "$GITHUB_ENV"
      - name: Resolve iOS bundle version
        env:
          IOS_BUILD_NUMBER: ${{ inputs.ios_build_number }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ -n "$IOS_BUILD_NUMBER" ]; then
            bundle_version="$IOS_BUILD_NUMBER"
          else
            bundle_version="$(node -e '
              const parts = require("./package.json").version.split(".").map(Number);
              if (parts.length !== 3 || parts.some((n) => !Number.isInteger(n))) {
                throw new Error("package.json version must be X.Y.Z");
              }
              console.log(parts[0] * 1000000 + parts[1] * 1000 + parts[2]);
            ')"
          fi
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"
          echo "IOS_BUNDLE_VERSION=$bundle_version" >> "$GITHUB_ENV"
          echo "Using CFBundleShortVersionString=$version CFBundleVersion=$bundle_version"
      - name: Configure manual App Store signing
        run: |
          options=src-tauri/gen/apple/ExportOptions.plist
          /usr/libexec/PlistBuddy -c "Set :method app-store-connect" "$options"
          /usr/libexec/PlistBuddy -c "Add :signingStyle string manual" "$options"
          /usr/libexec/PlistBuddy -c "Add :teamID string 9KA3NM38B6" "$options"
          /usr/libexec/PlistBuddy -c "Add :signingCertificate string Apple Distribution" "$options"
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles dict" "$options"
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:dev.leeef.leeefReader string $IOS_PROFILE_UUID" "$options"
          project=src-tauri/gen/apple/leeef_reader.xcodeproj/project.pbxproj
          perl -0pi -e 's/\$\(IOS_PROFILE_UUID\)/$ENV{IOS_PROFILE_UUID}/g; s/\$\(IOS_PROFILE_NAME\)/$ENV{IOS_PROFILE_NAME}/g' "$project"
      - name: Verify iOS signing settings
        run: |
          settings="$(env -u IOS_PROFILE_UUID -u IOS_PROFILE_NAME xcodebuild \
            -workspace src-tauri/gen/apple/leeef_reader.xcodeproj/project.xcworkspace \
            -scheme leeef_reader_iOS \
            -configuration release \
            -showBuildSettings)"
          grep -F "CODE_SIGN_IDENTITY = Apple Distribution" <<< "$settings"
          grep -F "CODE_SIGN_STYLE = Manual" <<< "$settings"
          grep -F "DEVELOPMENT_TEAM = 9KA3NM38B6" <<< "$settings"
          grep -F "PROVISIONING_PROFILE = $IOS_PROFILE_UUID" <<< "$settings"
          grep -F "PROVISIONING_PROFILE_SPECIFIER = $IOS_PROFILE_NAME" <<< "$settings"
      - name: Build signed App Store IPA
        env:
          APPLE_DEVELOPMENT_TEAM: 9KA3NM38B6
          CI: true
        run: |
          test -n "$IOS_PROFILE_UUID"
          bun run tauri ios build --ci --export-method app-store-connect \
            --config "{\"bundle\":{\"iOS\":{\"bundleVersion\":\"$IOS_BUNDLE_VERSION\"}}}"
      - name: Stage and verify IPA
        run: |
          mkdir -p "$RUNNER_TEMP/ios-dist"
          ipa="$(find src-tauri/gen/apple/build -name '*.ipa' | head -n 1)"
          test -n "$ipa"
          dest="$RUNNER_TEMP/ios-dist/Leeef-Reader-${APP_VERSION}-ios.ipa"
          cp "$ipa" "$dest"
          extract="$(mktemp -d)"
          unzip -q "$dest" -d "$extract"
          plist="$(echo "$extract"/Payload/*.app/Info.plist)"
          test -f "$plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist" | grep -Fx 'dev.leeef.leeefReader'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist" | grep -Fx "$APP_VERSION"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$plist" | grep -Fx "$IOS_BUNDLE_VERSION"
          echo "IOS_IPA=$dest" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: leeef-ios
          path: ${{ runner.temp }}/ios-dist/*
          if-no-files-found: error
      - name: Upload IPA to App Store Connect
        if: inputs.upload_appstore
        uses: apple-actions/upload-testflight-build@v4
        with:
          app-path: ${{ env.IOS_IPA }}
          issuer-id: ${{ vars.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ vars.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          wait-for-processing: true
  ios-submit:
    needs: ios
    if: >-
      always() &&
      github.repository == 'tianma-if/leeef-reader' &&
      inputs.submit_appstore &&
      (inputs.platforms == 'all' || inputs.platforms == 'ios' || inputs.platforms == 'appstore-submit') &&
      (inputs.platforms == 'appstore-submit' || needs.ios.result == 'success')
    name: Submit iOS version for App Review
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: app-store
    defaults:
      run:
        working-directory: apps/reader
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.release_tag }}
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler: "2.7.2"
      - name: Resolve App Store version and build
        env:
          IOS_BUILD_NUMBER: ${{ inputs.ios_build_number }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ -n "$IOS_BUILD_NUMBER" ]; then
            bundle_version="$IOS_BUILD_NUMBER"
          else
            bundle_version="$(node -e '
              const parts = require("./package.json").version.split(".").map(Number);
              if (parts.length !== 3 || parts.some((n) => !Number.isInteger(n))) {
                throw new Error("package.json version must be X.Y.Z");
              }
              console.log(parts[0] * 1000000 + parts[1] * 1000 + parts[2]);
            ')"
          fi
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"
          echo "IOS_BUNDLE_VERSION=$bundle_version" >> "$GITHUB_ENV"
          echo "Submitting App Store version=$version build=$bundle_version"
      - name: Submit App Store version for review
        env:
          APPSTORE_API_KEY_ID: ${{ vars.APPSTORE_API_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ vars.APPSTORE_ISSUER_ID }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          submit_dir="$RUNNER_TEMP/app-store-submit"
          mkdir -p "$submit_dir/fastlane"

          gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json body \
            --jq .body > "$submit_dir/release.md"

          RELEASE_BODY="$submit_dir/release.md" \
          ZH_RELEASE_NOTES="$submit_dir/release-notes-zh-Hans.txt" \
          EN_RELEASE_NOTES="$submit_dir/release-notes-en-US.txt" \
          ZH_STORE_METADATA="$GITHUB_WORKSPACE/store-assets/app-store/metadata.zh-CN.md" \
          EN_STORE_METADATA="$GITHUB_WORKSPACE/store-assets/app-store/metadata.en-US.md" \
          FASTLANE_METADATA_DIR="$submit_dir/fastlane/metadata" \
          node <<'NODE'
          const fs = require('node:fs')
          const path = require('node:path')

          const body = fs.readFileSync(process.env.RELEASE_BODY, 'utf8')
          const extract = (start, end) => {
            const match = body.match(new RegExp(`${start}\\s*\\n([\\s\\S]*?)(?=${end})`))
            if (!match) throw new Error(`Missing release-note section: ${start}`)
            const notes = match[1]
              .split(/\\r?\\n/)
              .filter((line) => /^-\s+/.test(line))
              .join('\n')
              .trim()
            if (!notes) throw new Error(`Release-note section is empty: ${start}`)
            if (notes.length > 4000) throw new Error(`Release notes exceed 4000 characters: ${start}`)
            return `${notes}\n`
          }

          fs.writeFileSync(
            process.env.ZH_RELEASE_NOTES,
            extract('## 主要更新', '(?:\\n关联 Issue：|\\n## )'),
          )
          fs.writeFileSync(
            process.env.EN_RELEASE_NOTES,
            extract('## Key Changes', '(?:\\nRelated Issue:|\\n## |$)'),
          )

          const writeStoreMetadata = (sourcePath, locale, keywordsLabel, descriptionHeading) => {
            const source = fs.readFileSync(sourcePath, 'utf8')
            const localeDir = path.join(process.env.FASTLANE_METADATA_DIR, locale)
            fs.mkdirSync(localeDir, { recursive: true })

            const field = (label) => {
              const match = source.match(new RegExp(`^- ${label}[：:]?\\s*(.+)$`, 'm'))
              if (!match) throw new Error(`Missing App Store metadata field: ${label}`)
              return match[1].trim()
            }
            const description = source.match(
              new RegExp(`## ${descriptionHeading}\\s*\\n([\\s\\S]*?)(?=\\n## |$)`),
            )
            if (!description || !description[1].trim()) {
              throw new Error(`Missing App Store description: ${locale}`)
            }

            fs.writeFileSync(path.join(localeDir, 'description.txt'), `${description[1].trim()}\\n`)
            fs.writeFileSync(path.join(localeDir, 'keywords.txt'), `${field(keywordsLabel)}\\n`)
            // App Store Connect carries supportUrl forward from the prior version.
            // Its public API currently rejects otherwise valid supportUrl PATCH requests.
          }

          writeStoreMetadata(
            process.env.ZH_STORE_METADATA,
            'zh-Hans',
            '关键词',
            '描述',
          )
          writeStoreMetadata(
            process.env.EN_STORE_METADATA,
            'en-US',
            'Keywords',
            'Description',
          )
          NODE

          APPSTORE_API_KEY_PATH="$submit_dir/api-key.json" \
          ruby -rjson -e '
            File.write(
              ENV.fetch("APPSTORE_API_KEY_PATH"),
              JSON.generate({
                key_id: ENV.fetch("APPSTORE_API_KEY_ID"),
                issuer_id: ENV.fetch("APPSTORE_ISSUER_ID"),
                key: ENV.fetch("APPSTORE_API_PRIVATE_KEY"),
                in_house: false
              })
            )
          '
          chmod 600 "$submit_dir/api-key.json"

          cat > "$submit_dir/Gemfile" <<'RUBY'
          source "https://rubygems.org"
          gem "fastlane", "2.240.1"
          RUBY
          cat > "$submit_dir/fastlane/Fastfile" <<'RUBY'
          default_platform(:ios)

          platform :ios do
            lane :submit_release do
              key = JSON.parse(File.read(File.join(ENV.fetch("SUBMIT_DIR"), "api-key.json")))
              Spaceship::ConnectAPI.token = Spaceship::ConnectAPI::Token.create(
                key_id: key.fetch("key_id"),
                issuer_id: key.fetch("issuer_id"),
                key: key.fetch("key")
              )
              app = Spaceship::ConnectAPI::App.find("dev.leeef.leeefReader")
              platform = Spaceship::ConnectAPI::Platform.map("ios")
              build = Spaceship::ConnectAPI::Build.all(
                app_id: app.id,
                version: ENV.fetch("APP_VERSION"),
                build_number: ENV.fetch("IOS_BUNDLE_VERSION"),
                platform: platform
              ).first
              UI.user_error!("Build #{ENV.fetch("IOS_BUNDLE_VERSION")} for #{ENV.fetch("APP_VERSION")} was not found") unless build
              UI.important("build #{build.app_version} (#{build.version}) state=#{build.processing_state} encryption=#{build.uses_non_exempt_encryption.inspect} expired=#{build.expired} missing_compliance=#{build.missing_export_compliance?}")
              if build.uses_non_exempt_encryption.nil?
                build.update(attributes: { usesNonExemptEncryption: false })
                UI.success("Set usesNonExemptEncryption=false before selecting the build")
              end
              edit_version = app.get_edit_app_store_version(platform: platform)
              UI.important("editable version=#{edit_version&.version_string} state=#{edit_version&.app_version_state}")
              if edit_version&.app_version_state == "WAITING_FOR_REVIEW"
                submission = app.get_in_progress_review_submission(platform: platform, includes: "items")
                UI.user_error!("#{edit_version.version_string} is waiting for review but has no cancelable submission") unless submission
                UI.important("Canceling submission #{submission.id} state=#{submission.state} so build #{build.version} can be attached")
                submission.cancel_submission
                editable = %w[PREPARE_FOR_SUBMISSION DEVELOPER_REJECTED]
                20.times do
                  sleep(10)
                  edit_version = app.get_edit_app_store_version(platform: platform)
                  UI.important("version state after cancel=#{edit_version&.app_version_state}")
                  break if editable.include?(edit_version&.app_version_state)
                end
                unless editable.include?(edit_version&.app_version_state)
                  UI.user_error!("Version stayed #{edit_version&.app_version_state} after canceling review")
                end
              end

              attempts = 0
              begin
                attempts += 1
                deliver(
                  api_key_path: File.join(ENV.fetch("SUBMIT_DIR"), "api-key.json"),
                  app_identifier: "dev.leeef.leeefReader",
                  app_version: ENV.fetch("APP_VERSION"),
                  build_number: ENV.fetch("IOS_BUNDLE_VERSION"),
                  platform: "ios",
                  skip_binary_upload: true,
                  skip_screenshots: true,
                  force: true,
                  submit_for_review: true,
                  automatic_release: true,
                  phased_release: false,
                  reset_ratings: false,
                  run_precheck_before_submit: true,
                  precheck_include_in_app_purchases: false,
                  release_notes: {
                    "zh-Hans" => File.read(File.join(ENV.fetch("SUBMIT_DIR"), "release-notes-zh-Hans.txt")).strip,
                    "en-US" => File.read(File.join(ENV.fetch("SUBMIT_DIR"), "release-notes-en-US.txt")).strip
                  },
                  submission_information: {
                    export_compliance_uses_encryption: false
                  }
                )
              rescue StandardError => error
                retryable = error.message.include?("could not be added")
                if retryable && attempts < 3
                  UI.important("App Store build is not attachable yet (attempt #{attempts}); waiting 60s")
                  sleep(60)
                  retry
                end
                raise
              end
            end
          end
          RUBY

          export BUNDLE_GEMFILE="$submit_dir/Gemfile"
          bundle _2.7.2_ config set path "$RUNNER_TEMP/fastlane-bundle"
          bundle _2.7.2_ install --jobs 4 --retry 3
          (
            cd "$submit_dir"
            SUBMIT_DIR="$submit_dir" bundle _2.7.2_ exec fastlane ios submit_release
          )
      - name: Remove App Store API key
        if: always()
        run: rm -f "$RUNNER_TEMP/app-store-submit/api-key.json"
