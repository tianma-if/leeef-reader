name: Build macOS DMG

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Upload the DMG to this existing GitHub Release tag (optional)
        required: false
        type: string
      notarize:
        description: Sign and notarize the DMG for public distribution
        required: true
        default: true
        type: boolean
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: macos-dmg-${{ github.event.release.tag_name || inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  dmg:
    # Public releases are audited below. Build and upload signed assets while
    # the target release is still a Draft by dispatching this workflow with a
    # release_tag.
    if: github.repository == 'tianma-if/leeef-reader' && github.event_name == 'workflow_dispatch'
    name: macOS universal DMG
    # flutter_inappwebview_macos 1.2.0-beta.3 currently needs the Xcode 27
    # Swift compiler. GitHub exposes this toolchain through the xcode-27 image.
    runs-on: xcode-27
    timeout-minutes: 60
    environment: macos-distribution
    steps:
      - name: Check out release source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag || github.ref }}
      - name: Validate release tag and app version
        if: github.event_name == 'release' || inputs.release_tag != ''
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          version="$(sed -nE 's/^version:[[:space:]]*([^+[:space:]]+).*/\1/p' pubspec.yaml)"
          test -n "$version"
          test "$RELEASE_TAG" = "v${version}"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.1
          channel: stable
          cache: true
      - name: Import Developer ID certificate
        if: github.event_name == 'release' || inputs.release_tag != '' || inputs.notarize
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.MACOS_CERTIFICATES_FILE_BASE64 }}
          p12-password: ${{ secrets.MACOS_CERTIFICATES_PASSWORD }}
      - name: Build DMG
        env:
          MACOS_CERTIFICATE_NAME: ${{ (github.event_name == 'release' || inputs.release_tag != '' || inputs.notarize) && secrets.MACOS_CERTIFICATE_NAME || '' }}
          APPLE_API_PRIVATE_KEY: ${{ (github.event_name == 'release' || inputs.release_tag != '' || inputs.notarize) && secrets.APPSTORE_API_PRIVATE_KEY || '' }}
          APPLE_API_KEY_ID: ${{ (github.event_name == 'release' || inputs.release_tag != '' || inputs.notarize) && vars.APPSTORE_API_KEY_ID || '' }}
          APPLE_API_ISSUER_ID: ${{ (github.event_name == 'release' || inputs.release_tag != '' || inputs.notarize) && vars.APPSTORE_ISSUER_ID || '' }}
          SPARKLE_PRIVATE_KEY: ${{ (github.event_name == 'release' || inputs.release_tag != '') && secrets.MACOS_SPARKLE_PRIVATE_KEY || '' }}
        run: ./tool/build_macos_dmg.sh
      - uses: actions/upload-artifact@v7
        with:
          name: leeef-reader-macos-dmg
          path: |
            build.noindex/distribution/*.dmg
            build.noindex/distribution/*.zip
            build.noindex/distribution/appcast.xml
          if-no-files-found: error
      - name: Verify automatic-update assets
        if: github.event_name == 'release' || inputs.release_tag != ''
        run: |
          test -f build.noindex/distribution/appcast.xml
          test "$(find build.noindex/distribution -maxdepth 1 -name '*.zip' | wc -l | tr -d ' ')" = 1
      - name: Attach installers and update metadata to GitHub Release
        if: github.event_name == 'release' || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          gh release upload "$RELEASE_TAG" \
            build.noindex/distribution/*.dmg \
            build.noindex/distribution/*.zip \
            build.noindex/distribution/appcast.xml \
            --clobber

  audit-published-release:
    if: github.repository == 'tianma-if/leeef-reader' && github.event_name == 'release'
    name: Audit published macOS assets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out release source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Download and audit existing release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          version="$(sed -nE 's/^version:[[:space:]]*([^+[:space:]]+).*/\1/p' pubspec.yaml)"
          build_number="$(sed -nE 's/^version:[[:space:]]*[^+[:space:]]+\+([0-9]+).*/\1/p' pubspec.yaml)"
          test -n "$version"
          test -n "$build_number"
          test "$RELEASE_TAG" = "v${version}"
          asset_dir="$RUNNER_TEMP/release-assets"
          mkdir -p "$asset_dir"
          gh release download "$RELEASE_TAG" --dir "$asset_dir"
          dmg="$asset_dir/Leeef-Reader-${version}-macos-universal.dmg"
          zip="$asset_dir/Leeef-Reader-${version}-macos-universal.zip"
          appcast="$asset_dir/appcast.xml"
          test -s "$dmg"
          test -s "$zip"
          test -s "$appcast"
          test "$(find "$asset_dir" -maxdepth 1 -type f | wc -l | tr -d ' ')" = 3
          zip_length="$(stat -c '%s' "$zip")"
          grep -Fq "sparkle:version=\"${build_number}\"" "$appcast"
          grep -Fq "sparkle:shortVersionString=\"${version}\"" "$appcast"
          grep -Fq "/releases/download/${RELEASE_TAG}/$(basename "$zip")" "$appcast"
          grep -Fq "length=\"${zip_length}\"" "$appcast"
          grep -Eq 'sparkle:edSignature="[^"]+"' "$appcast"
      - name: Restore a failed release to Draft
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release edit "$RELEASE_TAG" --draft
