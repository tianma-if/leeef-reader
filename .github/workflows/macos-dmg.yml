name: Build macOS DMG

on:
  workflow_dispatch:
    inputs:
      notarize:
        description: Sign and notarize the DMG for public distribution
        required: true
        default: true
        type: boolean
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  dmg:
    name: macOS universal DMG
    # flutter_inappwebview_macos 1.2.0-beta.3 currently needs the Xcode 27
    # Swift compiler. GitHub exposes this toolchain through the xcode-27 image.
    runs-on: xcode-27
    timeout-minutes: 60
    environment: macos-distribution
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.1
          channel: stable
          cache: true
      - name: Import Developer ID certificate
        if: github.event_name == 'push' || inputs.notarize
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.MACOS_CERTIFICATES_FILE_BASE64 }}
          p12-password: ${{ secrets.MACOS_CERTIFICATES_PASSWORD }}
      - name: Test
        run: |
          flutter pub get
          flutter test
      - name: Build DMG
        env:
          MACOS_CERTIFICATE_NAME: ${{ (github.event_name == 'push' || inputs.notarize) && secrets.MACOS_CERTIFICATE_NAME || '' }}
          APPLE_API_PRIVATE_KEY: ${{ (github.event_name == 'push' || inputs.notarize) && secrets.APPSTORE_API_PRIVATE_KEY || '' }}
          APPLE_API_KEY_ID: ${{ (github.event_name == 'push' || inputs.notarize) && vars.APPSTORE_API_KEY_ID || '' }}
          APPLE_API_ISSUER_ID: ${{ (github.event_name == 'push' || inputs.notarize) && vars.APPSTORE_ISSUER_ID || '' }}
        run: ./tool/build_macos_dmg.sh
      - uses: actions/upload-artifact@v7
        with:
          name: leeef-reader-macos-dmg
          path: build/distribution/*.dmg
          if-no-files-found: error
      - name: Attach DMG to GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" build/distribution/*.dmg --clobber
